onboarding = false

[theme]
name = "catppuccin"

[theme.custom]
accent = "#94e2d5"
# Sidebar row backgrounds: active workspace uses surface_dim, the navigate
# cursor uses surface0. Defaults are too close to the Mocha terminal bg.
# surface_dim also paints the sidebar border AND the active workspace row
# background (one token, not separable in config). Deep teal stays saturated
# at low luminance, so the border reads vivid while the light bold row text
# keeps ~3.4:1 contrast — unlike pink/red, which turns muddy when darkened.
surface_dim = "#2a7a6e"
surface0 = "#585b70"
surface1 = "#6c7086"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
mauve = "#f5c2e7"
teal = "#94e2d5"

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_sort = "spaces"

# Wider sidebar: default width up from 26, drag cap up from the stock 36.
sidebar_width = 32
sidebar_max_width = 48

# Compact agent rows: one line per agent, workspace dimmed for context, so
# the panel does not read as a second workspace list.
[ui.sidebar.agents]
rows = [["state_icon", "agent", { token = "workspace", dim = true }]]

[keys.indexed]
tabs = "ctrl"

[keys]
# prefix = "ctrl+shift+z"
workspace_picker = "ctrl+shift+a"
