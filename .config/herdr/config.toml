onboarding = false

# ── Theme ─────────────────────────────────────────────────────────────────
# Fixed to gruvbox-light instead of theme.auto_switch: Ghostty 1.3.1 answers
# the light/dark query (CSI ? 996 n) from the macOS system appearance, not
# from the terminal background, so auto_switch would follow the OS setting
# rather than the terminal. The Catppuccin Mocha setup this replaced is in the
# dotfiles history.
[theme]
name = "gruvbox-light"

# Gruvbox Light Hard (Ghostty) with the sidebar one shade down. Rule of thumb
# for every override: text stays at or above 4.5:1 on the soft sidebar
# (#f2e5bc) and on the tan active row (#ebdbb2), so the Gruvbox "bright" hues
# (the dark variants in slots 9-14) are used for text, and green, yellow and
# aqua are darkened further because their bright variants fall short.
[theme.custom]
# Dark orange, the Gruvbox signature, for the tab pill, borders, dots and
# navigation UI; herdr draws light text on the pill in light themes, and this
# shade clears 5.4:1 under cream text.
accent = "#af3a03"

# Gruvbox bg0_soft, one step under the pane cream, so the rail reads as a
# panel without a hard edge.
sidebar_bg = "#f2e5bc"

# Active row on bg1 (tan), the navigate cursor on bg2 so the two never look
# alike. surface_dim draws the sidebar's right edge, the spaces/agents
# divider and the agents header rule; the bg shades vanish there (under 2:1
# on the cream), so it takes fg4, 4.4:1, and the panel boundary reads at a
# glance. surface0 is the inactive tab pill behind the overlay0 tab number.
active_row_bg = "#ebdbb2"
selection_bg = "#d5c4a1"
surface_dim = "#7c6f64"
surface0 = "#ebdbb2"
surface1 = "#d5c4a1"

# State colors: Gruvbox light "bright" red, blue and purple as is; green,
# yellow and aqua darkened to clear 4.5:1 on the active row.
red = "#9d0006"
green = "#68630c"
yellow = "#85570e"
blue = "#076678"
mauve = "#8f3f71"
teal = "#396b4c"
peach = "#af3a03"

text = "#3c3836"
subtext0 = "#665c54"
overlay1 = "#504945"
overlay0 = "#6a5f55"

# ── UI ────────────────────────────────────────────────────────────────────
[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"

# Distinct static glyphs per agent state (blocked / working / done / idle /
# unknown) instead of same-shape colored dots, so state is readable by shape.
status_indicators = "symbols"

# Wider sidebar: default width up from 26, drag cap up from the stock 36.
sidebar_width = 32
sidebar_max_width = 48

# Outer terminal (Ghostty) title: active workspace + the focused pane's own
# title. Claude Code writes its conversation topic there, so the title bar
# doubles as a "what is this window doing" label. Hostname dropped (local box).
window_title = "{workspace} · {terminal_title}"

# tmux-style status area at the right edge of the tab row. Two command entries
# run status.sh on the herdr server: the first prints an agent fleet summary
# (blocked / done / working / idle counts) every 5s; the second prints nothing
# (so it stays invisible) and every 10s reports the $dirty and $rule tokens
# used by the sidebar rows below.
tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = "$HOME/.config/herdr/status.sh", interval_seconds = 5, timeout_seconds = 3 },
  { type = "command", command = "$HOME/.config/herdr/status.sh --report-metadata", interval_seconds = 10, timeout_seconds = 10 },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " · "

[ui.toast]
delivery = "terminal"

# Sidebar rows. Every token that is not the bold workspace name carries an
# explicit foreground instead of `dim`, because dimmed text disappears on the
# colored active row. Gruvbox scale, top to bottom: orange #af3a03 (Claude
# topic line, bold), purple #8f3f71 (agent name), fg2 #504945 (state), fg3
# #665c54 (workspace), blue #076678 (branch), darkened yellow #85570e
# ($dirty). All pairs clear WCAG AA on both the soft sidebar (#f2e5bc) and
# the tan active row (#ebdbb2). The $rule separator is a line, not text:
# gray (#928374, 2.9:1 on the sidebar) keeps it visible between entries while
# lighter than the panel edge above.
#
# herdr has no border option between sidebar entries; `row_gap` only adds
# blank rows. Each entry instead ends with a $rule row, a line of "─" that
# status.sh reports per workspace and per agent pane, which is why `row_gap`
# stays 0 below.
#
# The Catppuccin Mocha values these replaced (sky #89dceb, yellow #f9e2af,
# maroon #eba0ac, rose-gray #cfbfc5, warm subtext #b4a5aa, peach #fab387, rule
# #585b70) are in the dotfiles history.

# Space rows: name, then branch · ahead/behind · uncommitted changes.
# The branch keeps `dim = false` so it reads as "which branch" at a glance
# instead of blending into the grays.
# $dirty is reported by status.sh as "±<tracked changes> ?<untracked>" and
# disappears when the tree is clean (or when the reporter stops: 30s TTL).
[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  [{ token = "branch", fg = "#076678", dim = false }, "git_status", { token = "$dirty", fg = "#85570e" }],
  [{ token = "$rule", fg = "#928374" }],
]

# Agent rows: one status line per agent, workspace in a softer tone for
# context so the panel does not read as a second workspace list.
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", { token = "agent", fg = "#8f3f71", bold = true }, { token = "state_text", fg = "#504945" }, { token = "workspace", fg = "#665c54" }],
  [{ token = "$rule", fg = "#928374" }],
]

# Claude Code writes its conversation topic to the terminal title
# ("◐ herdr 세션 관리 UI 개선"); herdr strips the spinner glyph. Showing it as a
# second line turns the Agents panel into a live "what is each session doing"
# board. Delete this block to go back to one line per agent.
#
# The topic line is the one you scan to tell sessions apart, so it gets the
# most visible treatment in the panel: bold and `dim = false` (herdr's
# contextual style for secondary rows applies dim, which Ghostty renders by
# blending the color toward the background, which washes the line out).
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", { token = "agent", fg = "#8f3f71", bold = true }, { token = "state_text", fg = "#504945" }, { token = "workspace", fg = "#665c54" }],
  [{ token = "terminal_title_stripped", fg = "#af3a03", bold = true, dim = false }],
  [{ token = "$rule", fg = "#928374" }],
]

# ── Keys ──────────────────────────────────────────────────────────────────
[keys.indexed]
tabs = "ctrl"

[keys]
# prefix = "ctrl+shift+z"
workspace_picker = "ctrl+shift+a"
