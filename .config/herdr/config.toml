onboarding = false

# ── Theme ─────────────────────────────────────────────────────────────────
# herdr reads the host background (OSC 11 / DEC 2031) and picks the light or
# dark name, so flipping the Ghostty theme flips the sidebar chrome with it.
# Sidebar row `fg` values further down are fixed hex and do not follow this
# switch; they are tuned for the light palette and need a manual swap.
[theme]
name = "catppuccin"
auto_switch = true
dark_name = "catppuccin"
light_name = "catppuccin-latte"

# Catppuccin Mocha base with a burgundy accent family. Rule of thumb for every
# override: text that can land on a colored row must stay light, and the
# colored rows must stay dark, so contrast holds on both the mantle sidebar
# and the active row.
[theme.custom.dark]
# Wine-rose accent for the tab pill, borders, dots and navigation UI. herdr
# paints dark text on the accent (tab number), so it cannot go as deep as a
# true #800020 without losing that digit (#cc6480 vs #1e1e2e = 4.6:1, AA);
# the deep burgundy lives in the row backgrounds below instead.
accent = "#cc6480"

# Sidebar gets its own surface (Mocha mantle) so the dashboard rail reads as a
# distinct panel next to the translucent pane area (Ghostty opacity 0.9).
sidebar_bg = "#181825"

# herdr 0.8.2 split the old single surface_dim role into dedicated tokens:
#   active_row_bg — active Space / focused Agent row background
#   selection_bg  — Navigate-mode cursor row background
#   surface_dim   — sidebar border
# Deep burgundy for the active row keeps light text at roughly 9:1 contrast;
# the navigate cursor stays neutral gray so it is never confused with the
# active row.
active_row_bg = "#4a1a2c"
selection_bg = "#585b70"
surface_dim = "#6b2137"

# State colors. Mocha red (#f38ba8) is a pink-red that sits in the same hue
# family as the burgundy accent, so a blocked icon would read as "just another
# accent"; Frappe red is a true red and stays distinct. Green is softened to a
# sage so done checks and git-ahead counts stop fighting the burgundy rows.
red = "#e78284"
green = "#a3c9a8"
yellow = "#f9e2af"
blue = "#89b4fa"
mauve = "#f5c2e7"

# Warm neutrals. Catppuccin's grays are lavender-tinted; against burgundy they
# look cold, so the secondary text scale is shifted a few degrees toward rose
# (same luminance class as the originals, contrast unchanged).
subtext0 = "#b4a5aa"
overlay1 = "#8c7c82"
overlay0 = "#75666c"

# Light counterpart, matched to the Ghostty setup (white background, foreground
# #202020, Rider Melon Light ANSI palette from PhpStorm). The accent family is
# the Codex app's blue scale: blue-50 rows, blue-100 border, blue-500 accent,
# blue-600 agent names. Codex's own accent (#339cff, blue-300) is only 2.9:1
# against the light tab number herdr draws on the pill, so the pill takes
# blue-500 instead.
[theme.custom.light]
accent = "#0169cc"

# A shade under the pane background so the rail still reads as a panel
# without a hard edge against the pane area.
sidebar_bg = "#f7f7f7"
active_row_bg = "#e5f3ff"
selection_bg = "#e3e3e3"
surface_dim = "#99ceff"

# Catppuccin Latte's surfaces are blue-gray (#ccd0da, #bcc0cc); these neutral
# grays match the PhpStorm tool windows. surface0 is the inactive tab pill
# behind the overlay0 tab number.
surface0 = "#ececec"
surface1 = "#d5d5d5"

# ANSI-palette hues from the Ghostty config, so sidebar icons and the
# terminal text inside the panes share one set of colors.
red = "#d91400"
green = "#248700"
yellow = "#9a6d00"
blue = "#0f54d6"
mauve = "#941290"
teal = "#00855f"
peach = "#a14916"

text = "#202020"
subtext0 = "#656565"
overlay1 = "#5f5f5f"
overlay0 = "#727272"

# ── UI ────────────────────────────────────────────────────────────────────
[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"

# Distinct static glyphs per agent state (blocked / working / done / idle /
# unknown) instead of same-shape colored dots, so state is readable by shape.
status_indicators = "symbols"

# Wider sidebar: default width up from 26, drag cap up from the stock 36.
sidebar_width = 32
sidebar_max_width = 48

# Outer terminal (Ghostty) title: active workspace + the focused pane's own
# title. Claude Code writes its conversation topic there, so the title bar
# doubles as a "what is this window doing" label. Hostname dropped (local box).
window_title = "{workspace} · {terminal_title}"

# tmux-style status area at the right edge of the tab row. Two command entries
# run status.sh on the herdr server: the first prints an agent fleet summary
# (blocked / done / working / idle counts) every 5s; the second prints nothing
# (so it stays invisible) and every 10s reports the $dirty and $rule tokens
# used by the sidebar rows below.
tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = "$HOME/.config/herdr/status.sh", interval_seconds = 5, timeout_seconds = 3 },
  { type = "command", command = "$HOME/.config/herdr/status.sh --report-metadata", interval_seconds = 10, timeout_seconds = 10 },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " · "

[ui.toast]
delivery = "terminal"

# Sidebar rows. Every token that is not the bold workspace name carries an
# explicit foreground instead of `dim`, because dimmed text disappears on the
# colored active row. Light-palette scale, top to bottom: burnt orange #a14916
# (Claude topic line, bold), blue #004f99 (agent name), gray #5f5f5f (state),
# #656565 (workspace), blue #0f54d6 (branch), amber #826a00 ($dirty). All pairs
# clear WCAG AA on both the gray sidebar (#f7f7f7) and the blue active row
# (#e5f3ff). The $rule separator (#d5d5d5) is a line, not text, so it is kept
# faint on purpose.
#
# herdr has no border option between sidebar entries; `row_gap` only adds
# blank rows. Each entry instead ends with a $rule row, a line of "─" that
# status.sh reports per workspace and per agent pane, which is why `row_gap`
# stays 0 below.
#
# The dark-palette values these replaced (sky #89dceb, yellow #f9e2af, maroon
# #eba0ac, rose-gray #cfbfc5, warm subtext #b4a5aa, peach #fab387) are in the
# dotfiles history; `fg` is fixed hex and cannot follow theme.auto_switch.

# Space rows: name, then branch · ahead/behind · uncommitted changes.
# The branch keeps `dim = false` so it reads as "which branch" at a glance
# instead of blending into the grays.
# $dirty is reported by status.sh as "±<tracked changes> ?<untracked>" and
# disappears when the tree is clean (or when the reporter stops: 30s TTL).
[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  [{ token = "branch", fg = "#0f54d6", dim = false }, "git_status", { token = "$dirty", fg = "#826a00" }],
  [{ token = "$rule", fg = "#d5d5d5" }],
]

# Agent rows: one status line per agent, workspace in a softer tone for
# context so the panel does not read as a second workspace list.
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", { token = "agent", fg = "#004f99", bold = true }, { token = "state_text", fg = "#5f5f5f" }, { token = "workspace", fg = "#656565" }],
  [{ token = "$rule", fg = "#d5d5d5" }],
]

# Claude Code writes its conversation topic to the terminal title
# ("◐ herdr 세션 관리 UI 개선"); herdr strips the spinner glyph. Showing it as a
# second line turns the Agents panel into a live "what is each session doing"
# board. Delete this block to go back to one line per agent.
#
# The topic line is the one you scan to tell sessions apart, so it gets the
# most visible treatment in the panel: bold and `dim = false` (herdr's
# contextual style for secondary rows applies dim, which Ghostty renders by
# blending the color toward the background, which washes the line out).
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", { token = "agent", fg = "#004f99", bold = true }, { token = "state_text", fg = "#5f5f5f" }, { token = "workspace", fg = "#656565" }],
  [{ token = "terminal_title_stripped", fg = "#a14916", bold = true, dim = false }],
  [{ token = "$rule", fg = "#d5d5d5" }],
]

# ── Keys ──────────────────────────────────────────────────────────────────
[keys.indexed]
tabs = "ctrl"

[keys]
# prefix = "ctrl+shift+z"
workspace_picker = "ctrl+shift+a"
