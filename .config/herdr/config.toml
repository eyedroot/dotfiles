onboarding = false

# ── Theme ─────────────────────────────────────────────────────────────────
[theme]
name = "catppuccin"

# Catppuccin Mocha base with a burgundy accent family. Rule of thumb for every
# override: text that can land on a colored row must stay light, and the
# colored rows must stay dark, so contrast holds on both the mantle sidebar
# and the active row.
[theme.custom]
# Wine-rose accent for the tab pill, borders, dots and navigation UI. herdr
# paints dark text on the accent (tab number), so it cannot go as deep as a
# true #800020 without losing that digit; the deep burgundy lives in the row
# backgrounds below instead.
accent = "#c25b76"

# Sidebar gets its own surface (Mocha mantle) so the dashboard rail reads as a
# distinct panel next to the translucent pane area (Ghostty opacity 0.9).
sidebar_bg = "#181825"

# herdr 0.8.2 split the old single surface_dim role into dedicated tokens:
#   active_row_bg — active Space / focused Agent row background
#   selection_bg  — Navigate-mode cursor row background
#   surface_dim   — sidebar border
# Deep burgundy for the active row keeps light text at roughly 9:1 contrast;
# the navigate cursor stays neutral gray so it is never confused with the
# active row.
active_row_bg = "#4a1a2c"
selection_bg = "#585b70"
surface_dim = "#6b2137"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
mauve = "#f5c2e7"

# ── UI ────────────────────────────────────────────────────────────────────
[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"

# Distinct static glyphs per agent state (blocked / working / done / idle /
# unknown) instead of same-shape colored dots, so state is readable by shape.
status_indicators = "symbols"

# Wider sidebar: default width up from 26, drag cap up from the stock 36.
sidebar_width = 32
sidebar_max_width = 48

# Outer terminal (Ghostty) title: active workspace + the focused pane's own
# title. Claude Code writes its conversation topic there, so the title bar
# doubles as a "what is this window doing" label. Hostname dropped (local box).
window_title = "{workspace} · {terminal_title}"

# tmux-style status area at the right edge of the tab row. Two command entries
# run status.sh on the herdr server: the first prints an agent fleet summary
# (blocked / done / working / idle counts) every 5s; the second prints nothing
# (so it stays invisible) and reports a $dirty token per Git workspace every
# 10s for the Space rows below.
tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = "$HOME/.config/herdr/status.sh", interval_seconds = 5, timeout_seconds = 3 },
  { type = "command", command = "$HOME/.config/herdr/status.sh --report-dirty", interval_seconds = 10, timeout_seconds = 10 },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " · "

[ui.toast]
delivery = "terminal"

# Sidebar rows. Every token that is not the bold workspace name carries an
# explicit light foreground instead of `dim`, because dimmed text disappears
# on the colored active row. Palette: rosewater #f5e0dc, maroon #eba0ac,
# subtext1 #bac2de, subtext0 #a6adc8, yellow #f9e2af.

# Space rows: name, then branch · ahead/behind · uncommitted changes.
# $dirty is reported by status.sh as "±<tracked changes> ?<untracked>" and
# disappears when the tree is clean (or when the reporter stops: 30s TTL).
[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  [{ token = "branch", fg = "#a6adc8" }, "git_status", { token = "$dirty", fg = "#f9e2af" }],
]

# Agent rows: one status line per agent, workspace in a softer tone for
# context so the panel does not read as a second workspace list.
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", { token = "agent", fg = "#eba0ac", bold = true }, { token = "state_text", fg = "#bac2de" }, { token = "workspace", fg = "#a6adc8" }],
]

# Claude Code writes its conversation topic to the terminal title
# ("◐ herdr 세션 관리 UI 개선"); herdr strips the spinner glyph. Showing it as a
# second line turns the Agents panel into a live "what is each session doing"
# board. Delete this block to go back to one line per agent.
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", { token = "agent", fg = "#eba0ac", bold = true }, { token = "state_text", fg = "#bac2de" }, { token = "workspace", fg = "#a6adc8" }],
  [{ token = "terminal_title_stripped", fg = "#f5e0dc" }],
]

# ── Keys ──────────────────────────────────────────────────────────────────
[keys.indexed]
tabs = "ctrl"

[keys]
# prefix = "ctrl+shift+z"
workspace_picker = "ctrl+shift+a"
