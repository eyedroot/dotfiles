onboarding = false

# ── Theme ─────────────────────────────────────────────────────────────────
# Fixed to catppuccin-latte as the base instead of theme.auto_switch: Ghostty
# 1.3.1 answers the light/dark query (CSI ? 996 n) from the macOS system
# appearance, not from the terminal background, so auto_switch would follow
# the OS setting rather than the terminal. Every token herdr lets a config
# override is set below, so nothing of Latte shows through. The Catppuccin
# Mocha and Gruvbox setups this replaced are in the dotfiles history.
[theme]
name = "catppuccin-latte"

# PhpStorm's Rider Melon Day: white editor, #F7F7F7 tool windows, blue
# selection. Text stays at or above 4.5:1 on the sidebar (#F7F7F7) and on the
# blue active row (#D4E2FF), so text colors are the scheme's darker console
# variants where the syntax color falls short.
[theme.custom]
# Blue-3 of the Melon palette for the tab pill, borders, dots and navigation
# UI; herdr draws light text on the pill, 5.3:1 against this shade.
accent = "#3369D6"

panel_bg = "#FFFFFF"
sidebar_bg = "#F7F7F7"

# Active row on the focused-selection blue, the navigate cursor on the gray
# selection so the two never look alike. surface_dim draws the sidebar's
# right edge, the spaces/agents divider and the agents header rule, so it is
# dark enough (3.4:1 on the sidebar) for the panel boundary to read at a
# glance. surface0 is the inactive tab pill behind the overlay0 tab number.
active_row_bg = "#D4E2FF"
selection_bg = "#E3E3E3"
surface_dim = "#858585"
surface0 = "#ECECEC"
surface1 = "#D5D5D5"

# State colors: the console palette's darker variants.
red = "#AD0F00"
green = "#1B6600"
yellow = "#786200"
blue = "#0F54D6"
mauve = "#6B2FBA"
teal = "#005C43"
peach = "#A14916"

text = "#202020"
subtext0 = "#606060"
overlay1 = "#4D4D4D"
overlay0 = "#606060"

# ── UI ────────────────────────────────────────────────────────────────────
[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"

# Distinct static glyphs per agent state (blocked / working / done / idle /
# unknown) instead of same-shape colored dots, so state is readable by shape.
status_indicators = "symbols"

# Wider sidebar: default width up from 26, drag cap up from the stock 36.
sidebar_width = 32
sidebar_max_width = 48

# Outer terminal (Ghostty) title: active workspace + the focused pane's own
# title. Claude Code writes its conversation topic there, so the title bar
# doubles as a "what is this window doing" label. Hostname dropped (local box).
window_title = "{workspace} · {terminal_title}"

# tmux-style status area at the right edge of the tab row. Two command entries
# run status.sh on the herdr server: the first prints an agent fleet summary
# (blocked / done / working / idle counts) every 5s; the second prints nothing
# (so it stays invisible) and every 10s reports the $dirty and $rule tokens
# used by the sidebar rows below.
tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = "$HOME/.config/herdr/status.sh", interval_seconds = 5, timeout_seconds = 3 },
  { type = "command", command = "$HOME/.config/herdr/status.sh --report-metadata", interval_seconds = 10, timeout_seconds = 10 },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " · "

[ui.toast]
delivery = "terminal"

# Sidebar rows. Every token that is not the bold workspace name carries an
# explicit foreground instead of `dim`, because dimmed text disappears on the
# colored active row. The roles follow PhpStorm's syntax colors, top to
# bottom: purple #6B2FBA (Claude topic line, bold, the scheme's function
# color), blue #0F54D6 (agent name, bold, the keyword color), gray #606060
# (state), gray #4D4D4D (workspace), green #1B6600 (branch), yellow #786200
# ($dirty). All pairs clear WCAG AA on both the sidebar (#F7F7F7) and the
# active row (#D4E2FF). The $rule separator is a line, not text: gray #ADADAD
# keeps it visible between entries while lighter than the panel edge above.
#
# herdr has no border option between sidebar entries; `row_gap` only adds
# blank rows. Each entry instead ends with a $rule row, a line of "─" that
# status.sh reports per workspace and per agent pane, which is why `row_gap`
# stays 0 below.
#
# The Catppuccin Mocha and Gruvbox values these replaced are in the dotfiles
# history.

# Space rows: name, then branch · ahead/behind · uncommitted changes.
# The branch keeps `dim = false` so it reads as "which branch" at a glance
# instead of blending into the grays.
# $dirty is reported by status.sh as "±<tracked changes> ?<untracked>" and
# disappears when the tree is clean (or when the reporter stops: 30s TTL).
[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  [{ token = "branch", fg = "#1B6600", dim = false }, "git_status", { token = "$dirty", fg = "#786200" }],
  [{ token = "$rule", fg = "#ADADAD" }],
]

# Agent rows: one status line per agent, workspace in a softer tone for
# context so the panel does not read as a second workspace list.
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", { token = "agent", fg = "#0F54D6", bold = true }, { token = "state_text", fg = "#606060" }, { token = "workspace", fg = "#4D4D4D" }],
  [{ token = "$rule", fg = "#ADADAD" }],
]

# Claude Code writes its conversation topic to the terminal title
# ("◐ herdr 세션 관리 UI 개선"); herdr strips the spinner glyph. Showing it as a
# second line turns the Agents panel into a live "what is each session doing"
# board. Delete this block to go back to one line per agent.
#
# The topic line is the one you scan to tell sessions apart, so it gets the
# most visible treatment in the panel: bold and `dim = false` (herdr's
# contextual style for secondary rows applies dim, which Ghostty renders by
# blending the color toward the background, which washes the line out).
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", { token = "agent", fg = "#0F54D6", bold = true }, { token = "state_text", fg = "#606060" }, { token = "workspace", fg = "#4D4D4D" }],
  [{ token = "terminal_title_stripped", fg = "#6B2FBA", bold = true, dim = false }],
  [{ token = "$rule", fg = "#ADADAD" }],
]

# ── Keys ──────────────────────────────────────────────────────────────────
[keys.indexed]
tabs = "ctrl"

[keys]
# prefix = "ctrl+shift+z"
workspace_picker = "ctrl+shift+a"
