onboarding = false

[theme]
name = "catppuccin"

[theme.custom]
accent = "#eba0ac"
# Sidebar row backgrounds: active workspace uses surface_dim, the navigate
# cursor uses surface0. Defaults are too close to the Mocha terminal bg.
# surface_dim is rose-tinted (accent family) so the active row reads by hue,
# not just brightness; also tints separators and unfocused pane borders.
surface_dim = "#503a46"
surface0 = "#585b70"
surface1 = "#6c7086"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
mauve = "#f5c2e7"
teal = "#94e2d5"

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_sort = "priority"

# Compact agent rows: one line per agent, workspace dimmed for context so the
# panel reads as an attention queue instead of a second workspace list.
[ui.sidebar.agents]
rows = [["state_icon", "agent", { token = "workspace", dim = true }]]

[keys.indexed]
tabs = "ctrl"

[keys]
# prefix = "ctrl+shift+z"
workspace_picker = "ctrl+shift+a"
