onboarding = false

[theme]
name = "catppuccin"

[theme.custom]
accent = "#eba0ac"
# Sidebar row backgrounds: active workspace uses surface_dim, the navigate
# cursor uses surface0. Defaults are too close to the Mocha terminal bg.
# surface_dim also paints the sidebar border AND the active workspace row
# background (one token, not separable in config). This is the deepest rose
# that keeps the light bold row text at ~3:1 contrast; going brighter toward
# accent (#eba0ac) makes the active row unreadable again.
surface_dim = "#a25a6d"
surface0 = "#585b70"
surface1 = "#6c7086"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
mauve = "#f5c2e7"
teal = "#94e2d5"

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_sort = "spaces"

# Wider sidebar: default width up from 26, drag cap up from the stock 36.
sidebar_width = 32
sidebar_max_width = 48

# Compact agent rows: one line per agent, workspace dimmed for context, so
# the panel does not read as a second workspace list.
[ui.sidebar.agents]
rows = [["state_icon", "agent", { token = "workspace", dim = true }]]

[keys.indexed]
tabs = "ctrl"

[keys]
# prefix = "ctrl+shift+z"
workspace_picker = "ctrl+shift+a"
