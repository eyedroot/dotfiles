"$schema" = 'https://starship.rs/config-schema.json'

# Prompt layout after KatieUmbra/rose-pine-dots: a mark, the user name, a
# heart, the directory in a pill and the prompt character on the left; git,
# language versions, command time and the clock on the right.

command_timeout = 1000

format = """
[](fg:prompt_mark) \
$username\
[󰣐](fg:heart) \
[](fg:dir_pill)\
$directory\
[](fg:dir_pill) \
$character"""

right_format = """
$git_branch\
$git_status\
$nodejs\
$php\
$python\
$golang\
$rust\
$java\
$kotlin\
$cmd_duration\
$time"""

palette = 'gruvbox_light'

[username]
show_always = true
style_user = "italic fg:user_name"
style_root = "bold fg:prompt_error"
format = '[$user]($style) '

[directory]
style = "bg:dir_pill fg:dir_text"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = "󰊢"
style = "fg:git"
format = '[$symbol $branch(:$remote_branch)]($style) '

[git_status]
style = "fg:git_status"
format = '([$all_status$ahead_behind]($style) )'

[nodejs]
symbol = ""
style = "fg:lang"
format = '[$symbol ($version)]($style) '

[php]
symbol = ""
style = "fg:lang"
format = '[$symbol ($version)]($style) '

[python]
symbol = ""
style = "fg:lang"
format = '[$symbol ($version)(\(#$virtualenv\))]($style) '

[golang]
symbol = ""
style = "fg:lang"
format = '[$symbol ($version)]($style) '

[rust]
symbol = ""
style = "fg:lang"
format = '[$symbol ($version)]($style) '

[java]
symbol = ""
style = "fg:lang"
format = '[$symbol ($version)]($style) '

[kotlin]
symbol = ""
style = "fg:lang"
format = '[$symbol ($version)]($style) '

[cmd_duration]
show_milliseconds = true
style = "fg:duration"
format = '[ $duration]($style) '
show_notifications = true
min_time_to_notify = 45000

[time]
disabled = false
time_format = "%R"
style = "fg:time"
format = '[ $time]($style)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](bold fg:prompt_ok)'
error_symbol = '[❯](bold fg:prompt_error)'
vimcmd_symbol = '[❮](bold fg:vim_normal)'
vimcmd_replace_one_symbol = '[❮](bold fg:vim_replace)'
vimcmd_replace_symbol = '[❮](bold fg:vim_replace)'
vimcmd_visual_symbol = '[❮](bold fg:vim_visual)'

# Gruvbox Light Hard, matched to the Ghostty theme. Purple carries the mark,
# name and prompt character as iris does in the reference; text colors are
# the Gruvbox "bright" (dark) variants, green and aqua darkened further to
# clear 4.5:1 on the cream (#f9f5d7). The pill is solid aqua with fg0 text.
[palettes.gruvbox_light]
prompt_mark = "#8f3f71"   # purple (bright)
user_name = "#8f3f71"     # purple (bright)
heart = "#cc241d"         # red; a glyph, so the stock tone stays
dir_pill = "#689d6a"      # aqua
dir_text = "#282828"      # fg0
git = "#076678"           # blue (bright)
git_status = "#85570e"    # yellow, darkened
lang = "#396b4c"          # aqua, darkened
duration = "#665c54"      # fg3
time = "#665c54"          # fg3
prompt_ok = "#8f3f71"     # purple (bright)
prompt_error = "#9d0006"  # red (bright)
vim_normal = "#076678"    # blue (bright)
vim_replace = "#9d0006"   # red (bright)
vim_visual = "#8f3f71"    # purple (bright)

# Gruvbox Dark, used by the Unpeel dark appearance through the swap in
# .zshrc.shared. Dark text on the aqua pill as in the reference setup.
[palettes.gruvbox_dark]
prompt_mark = "#d3869b"   # purple (bright)
user_name = "#d3869b"     # purple (bright)
heart = "#fb4934"         # red (bright)
dir_pill = "#8ec07c"      # aqua (bright)
dir_text = "#282828"      # bg0
git = "#83a598"           # blue (bright)
git_status = "#fabd2f"    # yellow (bright)
lang = "#8ec07c"          # aqua (bright)
duration = "#a89984"      # gray
time = "#a89984"          # gray
prompt_ok = "#d3869b"     # purple (bright)
prompt_error = "#fb4934"  # red (bright)
vim_normal = "#83a598"    # blue (bright)
vim_replace = "#fb4934"   # red (bright)
vim_visual = "#d3869b"    # purple (bright)
