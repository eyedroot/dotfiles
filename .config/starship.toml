"$schema" = 'https://starship.rs/config-schema.json'

# Prompt layout after KatieUmbra/rose-pine-dots: a mark, the user name, a
# heart, the directory in a pill, the git branch and status in a second pill
# and the prompt character, all on the left with nothing on the right. The
# git pill opens in git_branch and closes in git_status so it only appears
# inside a repository.

command_timeout = 1000

format = """
[](fg:prompt_mark) \
$username\
[󰣐](fg:heart) \
[](fg:dir_pill)\
$directory\
[](fg:dir_pill) \
$git_branch\
$git_status\
$character"""

palette = 'phpstorm_dark'

[username]
show_always = true
style_user = "italic fg:user_name"
style_root = "bold fg:prompt_error"
format = '[$user]($style) '

[directory]
style = "bg:dir_pill fg:dir_text"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = "󰊢"
style = "bold bg:git_pill fg:git"
format = '[](fg:git_pill)[ $symbol $branch(:$remote_branch)]($style)'
truncation_length = 40
truncation_symbol = "…"

[git_status]
style = "bold bg:git_pill fg:git_status"
format = '([$all_status$ahead_behind]($style))[ ](bg:git_pill)[](fg:git_pill) '
conflicted = " =${count}"
stashed = " *${count}"
deleted = " ✘${count}"
renamed = " »${count}"
modified = " !${count}"
staged = " +${count}"
untracked = " ?${count}"
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇡${ahead_count}⇣${behind_count}"

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](bold fg:prompt_ok)'
error_symbol = '[❯](bold fg:prompt_error)'
vimcmd_symbol = '[❮](bold fg:vim_normal)'
vimcmd_replace_one_symbol = '[❮](bold fg:vim_replace)'
vimcmd_replace_symbol = '[❮](bold fg:vim_replace)'
vimcmd_visual_symbol = '[❮](bold fg:vim_visual)'

# PhpStorm's Rider Melon Light, used by the Unpeel light appearance through
# the swap in .zshrc.shared. Mark and prompt character take the keyword blue,
# the name the function purple, the heart the number pink; the directory pill
# is the editor selection blue with the editor text color on it. Text colors
# are the scheme's darker console variants where the syntax color falls short
# of 4.5:1 on white.
[palettes.phpstorm_light]
prompt_mark = "#0F54D6"   # keyword blue
user_name = "#6B2FBA"      # function purple
heart = "#AB2F6B"            # number pink
dir_pill = "#B8D9FF"          # editor selection blue
dir_text = "#202020"         # editor text
git_pill = "#DCEFD6"         # pale green, 1.2:1 against white so it reads as a pill, not a block
git = "#1B6600"           # console green, bright
git_status = "#786200"        # console yellow, bright
prompt_ok = "#0F54D6"     # keyword blue
prompt_error = "#AD0F00"    # console red, bright
vim_normal = "#0F54D6"    # keyword blue
vim_replace = "#AD0F00"     # console red, bright
vim_visual = "#6B2FBA"     # function purple

# PhpStorm's Rider Melon Dark, for the dark Ghostty theme. Dark text on the
# blue pill as in the reference setup.
[palettes.phpstorm_dark]
prompt_mark = "#6C95EB"   # keyword blue
user_name = "#C191FF"     # function purple
heart = "#ED94C0"         # number pink
dir_pill = "#6C95EB"      # keyword blue
dir_text = "#262626"      # editor background
git_pill = "#3C3F41"      # IDE panel gray; green and yellow stay above 5:1 on it
git = "#85C46C"           # constant green
git_status = "#D9B72B"    # console yellow
prompt_ok = "#6C95EB"     # keyword blue
prompt_error = "#FF5647"  # console red
vim_normal = "#6C95EB"    # keyword blue
vim_replace = "#FF5647"   # console red
vim_visual = "#C191FF"    # function purple
