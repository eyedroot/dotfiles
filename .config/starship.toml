"$schema" = 'https://starship.rs/config-schema.json'

# Prompt layout after KatieUmbra/rose-pine-dots: a mark, the user name, a
# heart, the directory in a pill and the prompt character on the left; git,
# language versions, command time and the clock on the right.

command_timeout = 1000

format = """
[](fg:prompt_mark) \
$username\
[󰣐](fg:heart) \
[](fg:dir_pill)\
$directory\
[](fg:dir_pill) \
$character"""

right_format = """
$git_branch\
$git_status\
$nodejs\
$php\
$python\
$golang\
$rust\
$java\
$kotlin\
$cmd_duration\
$time"""

palette = 'phpstorm_light'

[username]
show_always = true
style_user = "italic fg:user_name"
style_root = "bold fg:prompt_error"
format = '[$user]($style) '

[directory]
style = "bg:dir_pill fg:dir_text"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = "󰊢"
style = "fg:git"
format = '[$symbol $branch(:$remote_branch)]($style) '

[git_status]
style = "fg:git_status"
format = '([$all_status$ahead_behind]($style) )'

[nodejs]
symbol = ""
style = "fg:lang"
format = '[$symbol ($version)]($style) '

[php]
symbol = ""
style = "fg:lang"
format = '[$symbol ($version)]($style) '

[python]
symbol = ""
style = "fg:lang"
format = '[$symbol ($version)(\(#$virtualenv\))]($style) '

[golang]
symbol = ""
style = "fg:lang"
format = '[$symbol ($version)]($style) '

[rust]
symbol = ""
style = "fg:lang"
format = '[$symbol ($version)]($style) '

[java]
symbol = ""
style = "fg:lang"
format = '[$symbol ($version)]($style) '

[kotlin]
symbol = ""
style = "fg:lang"
format = '[$symbol ($version)]($style) '

[cmd_duration]
show_milliseconds = true
style = "fg:duration"
format = '[ $duration]($style) '
show_notifications = true
min_time_to_notify = 45000

[time]
disabled = false
time_format = "%R"
style = "fg:time"
format = '[ $time]($style)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](bold fg:prompt_ok)'
error_symbol = '[❯](bold fg:prompt_error)'
vimcmd_symbol = '[❮](bold fg:vim_normal)'
vimcmd_replace_one_symbol = '[❮](bold fg:vim_replace)'
vimcmd_replace_symbol = '[❮](bold fg:vim_replace)'
vimcmd_visual_symbol = '[❮](bold fg:vim_visual)'

# PhpStorm's Rider Melon Light, matched to the Ghostty colors. Mark and
# prompt character take the keyword blue, the name the function purple, the
# heart the number pink; the directory pill is the editor selection blue with
# the editor text color on it. Text colors are the scheme's darker console
# variants where the syntax color falls short of 4.5:1 on white.
[palettes.phpstorm_light]
prompt_mark = "#0F54D6"   # keyword blue
user_name = "#6B2FBA"      # function purple
heart = "#AB2F6B"            # number pink
dir_pill = "#B8D9FF"          # editor selection blue
dir_text = "#202020"         # editor text
git = "#1B6600"           # console green, bright
git_status = "#786200"        # console yellow, bright
lang = "#0E3E9E"           # console blue, bright
duration = "#606060"           # gray
time = "#606060"               # gray
prompt_ok = "#0F54D6"     # keyword blue
prompt_error = "#AD0F00"    # console red, bright
vim_normal = "#0F54D6"    # keyword blue
vim_replace = "#AD0F00"     # console red, bright
vim_visual = "#6B2FBA"     # function purple

# PhpStorm's Rider Melon Dark, used by the Unpeel dark appearance through the
# swap in .zshrc.shared. Dark text on the blue pill as in the reference setup.
[palettes.phpstorm_dark]
prompt_mark = "#6C95EB"   # keyword blue
user_name = "#C191FF"     # function purple
heart = "#ED94C0"         # number pink
dir_pill = "#6C95EB"      # keyword blue
dir_text = "#262626"      # editor background
git = "#85C46C"           # constant green
git_status = "#D9B72B"    # console yellow
lang = "#66C3CC"          # string teal
duration = "#909090"      # comment gray
time = "#909090"          # comment gray
prompt_ok = "#6C95EB"     # keyword blue
prompt_error = "#FF5647"  # console red
vim_normal = "#6C95EB"    # keyword blue
vim_replace = "#FF5647"   # console red
vim_visual = "#C191FF"    # function purple
