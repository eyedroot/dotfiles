"$schema" = 'https://starship.rs/config-schema.json'

# M365Princess Theme for Starship
# Inspired by oh-my-posh M365Princess theme

command_timeout = 1000

format = """
[](plum)\
$os\
$username\
[](bg:blush fg:plum)\
$directory\
[](bg:salmon fg:blush)\
$git_branch\
$git_status\
[](fg:salmon bg:sky)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:sky bg:teal_blue)\
$conda\
$time\
[ ](fg:teal_blue)\
$cmd_duration\
$line_break\
$character"""

palette = 'm365princess'

[os]
disabled = false
style = "bg:plum fg:white"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:plum fg:white"
style_root = "bg:plum fg:white"
format = '[ $user]($style)'

[directory]
style = "bg:blush fg:white"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:salmon"
format = '[[ $symbol $branch ](fg:white bg:salmon)]($style)'

[git_status]
style = "bg:salmon"
format = '[[($all_status$ahead_behind )](fg:white bg:salmon)]($style)'

[nodejs]
symbol = ""
style = "bg:sky"
format = '[[ $symbol( $version) ](fg:white bg:sky)]($style)'

[c]
symbol = " "
style = "bg:sky"
format = '[[ $symbol( $version) ](fg:white bg:sky)]($style)'

[rust]
symbol = ""
style = "bg:sky"
format = '[[ $symbol( $version) ](fg:white bg:sky)]($style)'

[golang]
symbol = ""
style = "bg:sky"
format = '[[ $symbol( $version) ](fg:white bg:sky)]($style)'

[php]
symbol = ""
style = "bg:sky"
format = '[[ $symbol( $version) ](fg:white bg:sky)]($style)'

[java]
symbol = " "
style = "bg:sky"
format = '[[ $symbol( $version) ](fg:white bg:sky)]($style)'

[kotlin]
symbol = ""
style = "bg:sky"
format = '[[ $symbol( $version) ](fg:white bg:sky)]($style)'

[haskell]
symbol = ""
style = "bg:sky"
format = '[[ $symbol( $version) ](fg:white bg:sky)]($style)'

[python]
symbol = ""
style = "bg:sky"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:white bg:sky)]($style)'

[docker_context]
symbol = ""
style = "bg:teal_blue"
format = '[[ $symbol( $context) ](fg:white bg:teal_blue)]($style)'

[conda]
symbol = "  "
style = "fg:white bg:teal_blue"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "bg:teal_blue"
format = '[[  $time ](fg:white bg:teal_blue)]($style)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](bold fg:salmon)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:plum)'
vimcmd_replace_one_symbol = '[❮](bold fg:blush)'
vimcmd_replace_symbol = '[❮](bold fg:blush)'
vimcmd_visual_symbol = '[❮](bold fg:sky)'

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "fg:teal_blue"
disabled = false
show_notifications = true
min_time_to_notify = 45000

# M365Princess Color Palette
[palettes.m365princess]
plum = "#9B4F96"
blush = "#D67BA6"
salmon = "#E8899E"
sky = "#74C2E1"
teal_blue = "#3B8EA5"
white = "#FFFFFF"
red = "#E06C75"
green = "#98C379"
yellow = "#E5C07B"
