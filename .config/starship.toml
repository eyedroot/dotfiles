"$schema" = 'https://starship.rs/config-schema.json'

# Rose Pine prompt after KatieUmbra/rose-pine-dots: a mark, the user name, a
# heart, the directory in a pill and the prompt character on the left; git,
# language versions, command time and the clock on the right.

command_timeout = 1000

format = """
[](fg:prompt_mark) \
$username\
[󰣐](fg:heart) \
[](fg:dir_pill)\
$directory\
[](fg:dir_pill) \
$character"""

right_format = """
$git_branch\
$git_status\
$nodejs\
$php\
$python\
$golang\
$rust\
$java\
$kotlin\
$cmd_duration\
$time"""

palette = 'rose_pine_dawn'

[username]
show_always = true
style_user = "italic fg:user_name"
style_root = "bold fg:prompt_error"
format = '[$user]($style) '

[directory]
style = "bg:dir_pill fg:dir_text"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = "󰊢"
style = "fg:git"
format = '[$symbol $branch(:$remote_branch)]($style) '

[git_status]
style = "fg:git_status"
format = '([$all_status$ahead_behind]($style) )'

[nodejs]
symbol = ""
style = "fg:lang"
format = '[$symbol ($version)]($style) '

[php]
symbol = ""
style = "fg:lang"
format = '[$symbol ($version)]($style) '

[python]
symbol = ""
style = "fg:lang"
format = '[$symbol ($version)(\(#$virtualenv\))]($style) '

[golang]
symbol = ""
style = "fg:lang"
format = '[$symbol ($version)]($style) '

[rust]
symbol = ""
style = "fg:lang"
format = '[$symbol ($version)]($style) '

[java]
symbol = ""
style = "fg:lang"
format = '[$symbol ($version)]($style) '

[kotlin]
symbol = ""
style = "fg:lang"
format = '[$symbol ($version)]($style) '

[cmd_duration]
show_milliseconds = true
style = "fg:duration"
format = '[ $duration]($style) '
show_notifications = true
min_time_to_notify = 45000

[time]
disabled = false
time_format = "%R"
style = "fg:time"
format = '[ $time]($style)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](bold fg:prompt_ok)'
error_symbol = '[❯](bold fg:prompt_error)'
vimcmd_symbol = '[❮](bold fg:vim_normal)'
vimcmd_replace_one_symbol = '[❮](bold fg:vim_replace)'
vimcmd_replace_symbol = '[❮](bold fg:vim_replace)'
vimcmd_visual_symbol = '[❮](bold fg:vim_visual)'

# Rose Pine Dawn, matched to the Ghostty theme. Accents used as text are the
# Dawn colors darkened to 4.5:1 on the base (#faf4ed); the pill is foam
# tinted into the base so the text color stays readable on it.
[palettes.rose_pine_dawn]
prompt_mark = "#6b5b7e"   # iris, darkened
user_name = "#6b5b7e"     # iris, darkened
heart = "#b4637a"         # love; a glyph, so the stock tone stays
dir_pill = "#bcd0cf"      # foam tint
dir_text = "#575279"      # text
git = "#286983"           # pine, darkened
git_status = "#85591d"    # gold, darkened
lang = "#3d6970"          # foam, darkened
duration = "#635f78"    # subtle, darkened
time = "#635f78"        # subtle, darkened
prompt_ok = "#6b5b7e"     # iris, darkened
prompt_error = "#8f4f61"  # love, darkened
vim_normal = "#286983"    # pine, darkened
vim_replace = "#8f4f61"   # love, darkened
vim_visual = "#6b5b7e"    # iris, darkened

# Rose Pine (dark), used by the Unpeel dark appearance through the swap in
# .zshrc.shared. Dark text on the foam pill as in the reference setup.
[palettes.rose_pine]
prompt_mark = "#c4a7e7"   # iris
user_name = "#9ccfd8"     # foam
heart = "#eb6f92"         # love
dir_pill = "#9ccfd8"      # foam
dir_text = "#191724"      # base
git = "#31748f"           # pine
git_status = "#f6c177"    # gold
lang = "#9ccfd8"          # foam
duration = "#908caa"      # subtle
time = "#908caa"          # subtle
prompt_ok = "#c4a7e7"     # iris
prompt_error = "#eb6f92"  # love
vim_normal = "#31748f"    # pine
vim_replace = "#eb6f92"   # love
vim_visual = "#c4a7e7"    # iris
