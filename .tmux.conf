# tmux configuration

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Mouse support
set -g mouse on

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows on close
set -g renumber-windows on

# Prevent automatic window renaming
set -g allow-rename off
setw -g automatic-rename off

# Increase scrollback
set -g history-limit 10000

# Reduce escape delay
set -sg escape-time 10

# Focus events
set -g focus-events on

# Catppuccin theme
set -g @catppuccin_flavor "mocha"

# Window style
set -g @catppuccin_window_status_style "slanted"
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_flags "icon"

# Pane border
set -g @catppuccin_pane_active_border_style "fg=#{@thm_lavender}"

# Status bar
set -g status-position bottom
set -g status-left-length 40
set -g status-right-length 150

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect: restore pane contents
set -g @resurrect-capture-pane-contents 'on'

# Continuum: auto-save every 15 min + auto-restore on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# CPU module: show CPU + RAM together
set -g @catppuccin_cpu_text " #{l:#{cpu_percentage}} 󰍛 #{l:#{ram_percentage}}"

# Load catppuccin
run "~/.tmux/plugins/tmux/catppuccin.tmux"

# Status left: session
set -gF status-left "#{E:@catppuccin_status_session}"

# Status right: directory + cpu + battery + date_time
set -gF status-right "#{E:@catppuccin_status_directory}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -agF status-right "#{E:@catppuccin_status_date_time}"

# Initialize TPM (keep at bottom)
run "~/.tmux/plugins/tpm/tpm"

source-file "$HOME/.config/kaku/tmux/kaku.tmux.conf" # Kaku tmux Integration
